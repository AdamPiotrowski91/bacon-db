[build-system]
requires = ["hatchling >= 1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/bacon_db"]

[tool.hatch.build.targets.wheel]
packages = ["bacon_db"]

[project]
name = "bacon-db"
version = "0.1.0"
description = "A Python simple database library"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    "pytest >= 9.0.3, < 10",
    "pytest-mock >= 3.15.1, < 4",
    "isort >= 8.0.1",
    "pre-commit >= 4.6",
    "codespell >= 2.4.2",
]
