[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/bdb"]

[tool.hatch.build.targets.wheel]
packages = ["bdb"]

[project]
name = "bacon-db"
version = "0.1.0"
description = "A Python simple database library"
requires-python = ">=3.14"
